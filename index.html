<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Layer Map — 3D Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, sans-serif;
    background: #141922;
    color: #dfe6f0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 300px;
    min-width: 300px;
    overflow-y: auto;
    padding: 16px;
    background: #1c222e;
    border-right: 1px solid #2c3646;
  }
  h1 { font-size: 17px; margin: 0 0 14px; }
  h2 { font-size: 14px; margin: 0 0 6px; }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; margin-bottom: 3px; color: #9fb0c7; font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  input[type="number"], input[type="file"] {
    width: 100%;
    padding: 6px 8px;
    background: #10151d;
    color: #dfe6f0;
    border: 1px solid #334055;
    border-radius: 6px;
  }
  button {
    width: 100%;
    padding: 9px;
    margin-top: 4px;
    background: #3b82f6;
    color: #fff;
    border: 0;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #33415c; cursor: default; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: #9fb0c7; font-size: 13px; }
  #status { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: #8fd18f; }
  #status.error { color: #ff8f8f; }
  #layer-panel { margin-top: 16px; border-top: 1px solid #2c3646; padding-top: 12px; }
  .hint { margin: 0 0 8px; font-size: 11px; color: #7c8aa0; }
  #layer-list { list-style: none; margin: 0; padding: 0; }
  #layer-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 6px;
    background: #10151d;
    margin-bottom: 5px;
  }
  #layer-list input[type="color"] {
    width: 34px;
    height: 26px;
    padding: 0;
    border: 1px solid #334055;
    border-radius: 4px;
    background: none;
    cursor: pointer;
  }
  #layer-list .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layer-list .height { margin-left: auto; font-size: 11px; color: #7c8aa0; white-space: nowrap; }
  #layer-list li.layer-row { cursor: grab; }
  #layer-list li.drag-over { outline: 2px solid #3b82f6; }
  #layer-list li.group { display: block; background: #1a2230; border: 1px dashed #3b82f6; }
  #layer-list .group-header { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-weight: 600; cursor: grab; }
  #layer-list .group-children { list-style: none; margin: 4px 0 4px 12px; padding: 2px 0 2px 8px; border-left: 2px solid #3b82f6; }
  button.small { width: auto; padding: 4px 12px; margin: 0 0 8px; font-weight: 500; }
  button.mini { width: auto; padding: 0 7px; margin: 0; margin-left: auto; background: #33415c; font-weight: 400; }
  #viewport { flex: 1; position: relative; }
  #viewport canvas { display: block; }
  body.clean #sidebar { display: none; }
  #notfound {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #141922;
    color: #dfe6f0;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #notfound[hidden] { display: none; }
  #notfound h1 { font-size: 40px; margin: 0; color: #ff8f8f; }
  #notfound code { background: #10151d; padding: 2px 6px; border-radius: 4px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <aside id="sidebar">
    <h1>SVG → 3D Layer Map</h1>
    <label class="field">
      <span>SVG file</span>
      <input type="file" id="file" accept=".svg,image/svg+xml">
    </label>
    <div class="row">
      <label class="field">
        <span>Map width (mm)</span>
        <input type="number" id="width" value="120" min="1" step="0.5">
      </label>
      <label class="field">
        <span>Map height (mm)</span>
        <input type="number" id="height" value="90" min="1" step="0.5">
      </label>
    </div>
    <label class="field">
      <span>Layer thickness (mm)</span>
      <input type="number" id="thickness" value="2" min="0.1" step="0.1">
    </label>
    <button id="render" disabled>Render 3D map</button>
    <label class="check"><input type="checkbox" id="autorotate"> Auto-rotate</label>
    <p id="status"></p>
    <div id="layer-panel" hidden>
      <h2>Layers</h2>
      <button id="add-group" type="button" class="small">+ Add group</button>
      <button id="save-config" type="button" class="small">Save config (.json)</button>
      <p class="hint">First in the list is the bottom layer. Drag to orbit, scroll to zoom.</p>
      <ul id="layer-list"></ul>
    </div>
  </aside>
  <main id="viewport"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
